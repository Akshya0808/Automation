
name: CD - Continuous Delivery

on:
  workflow_run:
    workflows: ["Playwright Tests"]
    types:
      - completed
  workflow_dispatch:

jobs:
  delivery:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show delivery message
        run: echo "CD pipeline started successfully!"

      - name: Create delivery package
        run: |
          mkdir delivery-package
          echo "My first delivery package" > delivery-package/readme.txt

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: delivery-package
          path: delivery-package/
